# Every push is built and tested on both platforms this program ships for.
#
# It holds no secrets and needs none: nothing here signs anything and nothing
# here publishes anything. It answers one question — does this still work on a
# clean machine that has never seen the code before? — and puts a green tick or
# a red cross on the commit, so a break is something you find out about rather
# than something a customer tells you.

name: Check

on:
  # WHAT: no push trigger of its own any more. WHY: "Build everything" runs this on every push, beside the five builds, so it is not run twice.
  pull_request:
  workflow_dispatch:
  # WHAT: lets "Build everything" and "Release" run these tests. WHY: one copy of the tests.
  workflow_call:
    inputs:
      ref:  # WHAT: the commit to build; empty means the one the run started on. WHY: a release builds exactly the commit it names.
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-14
            name: macOS
          - os: ubuntu-22.04
            name: Linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # WHAT: v4.4.0, 2026-07-20. WHY: pinned by commit, so a moved tag can never change what runs here.
        with:
          ref: ${{ inputs.ref }}  # WHAT: the commit asked for, or empty for the run's own. WHY: as the input says.
          persist-credentials: false  # WHAT: the job's token is not left in .git/config. WHY: nothing after checkout needs it, so no later step can borrow it.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # WHAT: the stable branch, 2026-10-16. WHY: pinned by commit, as above.
        with:
          toolchain: stable  # WHAT: stable Rust. WHY: pinned by commit, the action no longer reads it from the ref.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # WHAT: v2.9.3, 2026-10-20. WHY: pinned by commit, so a moved tag can never change what runs here.

      # The PDF engine is a third-party binary kept out of this repository, and
      # the tests that open a drawing genuinely need it. Leaving it out made
      # this workflow fail on both platforms while the Mac build, which does
      # fetch it, passed on the very same commit.
      #
      # Fetched straight off the release rather than through the API. Asking
      # the API which file to take costs an anonymous request, every runner on
      # GitHub shares that allowance, and when it runs out the answer is a 403
      # and a red cross on work that is perfectly fine. The download address is
      # made of the pinned build number and the file's name, so it can be
      # written out here and needs nobody's permission.
      - name: What a Linux desktop program is built against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: The PDF engine
        shell: bash
        run: |
          set -euo pipefail
          build="$(grep '^BUILD=' third_party/pdfium/embedded/VERSION | cut -d= -f2)"
          case "${{ runner.os }}" in
            Windows) want="pdfium-win-x64";  file="pdfium.dll" ;;
            macOS)   want="pdfium-mac-univ"; file="libpdfium.dylib" ;;
            *)       want="pdfium-linux-x64"; file="libpdfium.so" ;;
          esac
          url="https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F$build/$want.tgz"
          echo "PDFium $build: $url"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 "$url" -o pdfium.tgz
          mkdir -p unpacked
          tar -xzf pdfium.tgz -C unpacked
          found="$(find unpacked -name "$file" | head -1)"
          test -n "$found" || { echo "no $file in that archive" >&2; exit 1; }
          cp "$found" "third_party/pdfium/embedded/$file"
          ls -l "third_party/pdfium/embedded/$file"

      - name: The whole test suite
        run: cargo test --workspace

      # WHAT: the store upload scripts' own tests, offline. WHY: what Play and App Store Connect are told is proven on every push, not first found out at a release.
      - name: The store upload scripts
        if: runner.os == 'Linux'  # WHAT: once, on Linux. WHY: plain Python and openssl; one platform is enough.
        run: python3 tools/test_stores.py  # WHAT: run them. WHY: as above.

# Builds and tests the Linux program, for the PC that holds the signing key to
# sign and publish with the Windows and Mac halves (docs/RELEASING.md).
#
# Like the Windows build it holds no credentials at all: the program it makes
# is unsigned until the release signs it, and every copy checks that signature
# against the keys compiled into itself before installing anything.
#
# Built on the oldest Ubuntu GitHub still runs, so the program starts on any
# Linux desktop at least that new; it carries the PDF engine inside it, as the
# Windows one does, and needs nothing installed beside it.

name: Linux build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  # WHAT: lets "Build everything" (every push) and "Release" run this same build. WHY: one copy of each platform's build, never two drifting apart.
  workflow_call:
    inputs:
      ref:  # WHAT: the commit to build; empty means the one the run started on. WHY: a release builds exactly the commit it names.
        type: string
        default: ""
      check_only:  # WHAT: build and test, keep nothing, sign nothing. WHY: the build on every push proves it builds; it must not leave files a release could pick up.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.workflow }}-${{ github.ref }}  # WHAT: one queue per calling workflow and branch. WHY: a push build must never cancel a release build of the same branch, or the other way round.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # WHAT: v4.4.0, 2026-07-20. WHY: pinned by commit, so a moved tag can never change what runs here.
        with:
          ref: ${{ inputs.ref }}  # WHAT: the commit asked for, or empty for the run's own. WHY: as the input says.
          persist-credentials: false  # WHAT: the job's token is not left in .git/config. WHY: nothing after checkout needs it, so no later step can borrow it.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # WHAT: the stable branch, 2026-10-16. WHY: pinned by commit, as above.
        with:
          toolchain: stable  # WHAT: stable Rust. WHY: pinned by commit, the action no longer reads it from the ref.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # WHAT: v2.9.3, 2026-10-20. WHY: pinned by commit, so a moved tag can never change what runs here.

      - name: What a Linux desktop program is built against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      # The PDF engine is a third-party binary and is not in this repository.
      # The version is pinned by third_party/pdfium/embedded/VERSION.
      - name: The PDF engine
        run: |
          set -euo pipefail
          build="$(grep '^BUILD=' third_party/pdfium/embedded/VERSION | cut -d= -f2)"
          url="https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F$build/pdfium-linux-x64.tgz"
          echo "PDFium $build: $url"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 "$url" -o pdfium.tgz
          mkdir -p unpacked
          tar -xzf pdfium.tgz -C unpacked
          found="$(find unpacked -name 'libpdfium.so' | head -1)"
          test -n "$found" || { echo "no libpdfium.so in that archive" >&2; exit 1; }
          cp "$found" third_party/pdfium/embedded/libpdfium.so
          ls -l third_party/pdfium/embedded/libpdfium.so

      - name: The whole test suite
        run: cargo test --workspace

      - name: Build the program
        env:
          RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=crate"  # WHAT: this machine's workspace path kept out of the binary. WHY: only CI knows it (reverse-engineering hardening, 2026-11-11)
        run: cargo build --release -p hyperview

      - name: Name it the way it ships
        id: files
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp target/release/hyperview out/ExcaliburView-linux
          chmod 755 out/ExcaliburView-linux
          ls -l out
          sha256sum out/ExcaliburView-linux

      # The one file the PC picks up, named for the version, the way the
      # Windows and Mac halves are.
      - name: Hand it over
        if: ${{ !inputs.check_only }}  # WHAT: only when keeping the files. WHY: a check build must leave nothing a release could pick up.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # WHAT: v4.6.2, 2025-03-19. WHY: pinned by commit, so a moved tag can never change what runs here.
        with:
          name: linux-${{ steps.files.outputs.version }}
          path: out/ExcaliburView-linux
          if-no-files-found: error
          retention-days: 30

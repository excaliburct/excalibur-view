# Builds the two Windows programs, so that a compiler is not something
# anybody has to have installed to put a version out.
#
# The Mac half has worked this way since 0.6.4 and the Windows half did not,
# on the assumption that the computer holding the signing key would also be a
# computer with Rust on it. It was not, and there was no reason it should be:
# the key is the only thing that genuinely has to live there.
#
# So both halves are built the same way now. What this produces is unsigned by
# us. The release is signed and published from the machine that holds the key,
# which never leaves it. See docs/RELEASING.md.

name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  # WHAT: lets "Build everything" (every push) and "Release" run this same build. WHY: one copy of each platform's build, never two drifting apart.
  workflow_call:
    inputs:
      ref:  # WHAT: the commit to build; empty means the one the run started on. WHY: a release builds exactly the commit it names.
        type: string
        default: ""
      check_only:  # WHAT: build and test, keep nothing, sign nothing. WHY: the build on every push proves it builds; it must not leave files a release could pick up.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}  # WHAT: one queue per calling workflow and branch. WHY: a push build must never cancel a release build of the same branch, or the other way round.
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # WHAT: v4.4.0, 2026-07-20. WHY: pinned by commit, so a moved tag can never change what runs here.
        with:
          ref: ${{ inputs.ref }}  # WHAT: the commit asked for, or empty for the run's own. WHY: as the input says.
          persist-credentials: false  # WHAT: the job's token is not left in .git/config. WHY: nothing after checkout needs it, so no later step can borrow it.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # WHAT: the stable branch, 2026-10-16. WHY: pinned by commit, as above.
        with:
          toolchain: stable  # WHAT: stable Rust. WHY: pinned by commit, the action no longer reads it from the ref.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # WHAT: v2.9.3, 2026-10-20. WHY: pinned by commit, so a moved tag can never change what runs here.

      # The PDF engine is a third-party binary kept out of this repository and
      # pinned by third_party/pdfium/embedded/VERSION, so this fetches exactly
      # the build a release was tested against. Straight off the release, not
      # through the API: the API costs an anonymous request that every runner
      # on GitHub shares, and when that allowance runs out a good build fails
      # for a reason that has nothing to do with the code.
      - name: The PDF engine
        shell: bash
        run: |
          set -euo pipefail
          build="$(grep '^BUILD=' third_party/pdfium/embedded/VERSION | cut -d= -f2)"
          url="https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F$build/pdfium-win-x64.tgz"
          echo "PDFium $build: $url"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 "$url" -o pdfium.tgz
          mkdir -p unpacked
          tar -xzf pdfium.tgz -C unpacked
          found="$(find unpacked -name 'pdfium.dll' | head -1)"
          test -n "$found" || { echo "no pdfium.dll in that archive" >&2; exit 1; }
          cp "$found" third_party/pdfium/embedded/pdfium.dll
          ls -l third_party/pdfium/embedded/pdfium.dll

      # A release that does not pass its own tests is not a release. This is
      # the same suite Check runs; it runs again here because this is the
      # build somebody is about to sign and hand to every seat in a shop.
      - name: The whole test suite
        run: cargo test --workspace

      - name: Build both programs
        env:
          RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=crate"  # WHAT: this machine's workspace path kept out of the binary. WHY: only CI knows it (reverse-engineering hardening, 2026-11-11)
        run: cargo build --release -p hyperview -p hyperview-server

      # Named the way the release publishes them, so nobody has to know which
      # crate produced which file.
      - name: Name them the way they ship
        id: files
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp target/release/hyperview.exe out/ExcaliburView.exe
          cp target/release/hyperview-server.exe out/ExcaliburView-Server.exe
          ls -l out
          sha256sum out/*.exe

      - name: Hand them over
        if: ${{ !inputs.check_only }}  # WHAT: only when keeping the files. WHY: a check build must leave nothing a release could pick up.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # WHAT: v4.6.2, 2025-03-19. WHY: pinned by commit, so a moved tag can never change what runs here.
        with:
          name: windows-${{ steps.files.outputs.version }}
          path: out/*.exe
          if-no-files-found: error
          retention-days: 30

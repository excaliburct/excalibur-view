# Builds the iPad app on one of GitHub's Macs: the Rust library, the Xcode
# project, and a Simulator build that proves the whole thing compiles and
# links. With "archive" ticked it also makes the App Store archive, signed by
# Apple's automatic signing, and with "upload" it sends it to App Store Connect,
# where it shows up in TestFlight.
#
# What this holds, and what it deliberately does not:
#
#   It uses the App Store Connect API key the Mac build already has
#   (APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER). For an archive the
#   key needs the App Manager or Admin role, because Xcode uses it to make the
#   signing certificate and profile it needs. The team is read from
#   MACOS_SIGN_IDENTITY, which names it in brackets.
#
#   It does NOT have the Excalibur signing key, and the iPad app has no use
#   for it: the App Store installs the updates, not the program.
#
# Started by hand, by "Build everything" on every push (check only: the
# Simulator build, no key, nothing kept), and by "Release" (archived, sent to
# App Store Connect, then submitted for review). See mobile/ios/build.sh,
# which is what it runs and what builds the same thing on a Mac of your own.

name: iPad build

on:
  workflow_dispatch:
    inputs:
      archive:
        description: "Make the signed App Store archive"
        type: boolean
        default: false
      upload:
        description: "Send the archive to App Store Connect (TestFlight)"
        type: boolean
        default: false
  # WHAT: lets "Build everything" (every push) and "Release" run this same build. WHY: one copy of each platform's build, never two drifting apart.
  workflow_call:
    inputs:
      ref:  # WHAT: the commit to build; empty means the one the run started on. WHY: a release builds exactly the commit it names.
        type: string
        default: ""
      check_only:  # WHAT: build and test, keep nothing, sign nothing. WHY: the build on every push proves it builds; it must not leave files a release could pick up.
        type: boolean
        default: false
      archive:  # WHAT: as the input above. WHY: the Release workflow asks for an archive.
        type: boolean
        default: false
      upload:  # WHAT: as the input above. WHY: the Release workflow sends it to App Store Connect.
        type: boolean
        default: false
      build_number:  # WHAT: the build number to stamp; empty means the run number, as before. WHY: the Release workflow picks one and then looks the build up by it.
        type: string
        default: ""
    secrets:  # WHAT: the App Store Connect key, passed only by a caller that archives. WHY: the build on every push passes none.
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      MACOS_SIGN_IDENTITY:
        required: false

# Never on a pull request. A pull request can come from anybody's fork and
# would run their code with the API key in reach.

permissions:
  contents: read

concurrency:
  group: ipad-build-${{ github.workflow }}-${{ github.ref }}  # WHAT: one queue per calling workflow and branch. WHY: a push build must never cancel a release build of the same branch, or the other way round.
  cancel-in-progress: true

jobs:
  build:
    # Xcode 26, which App Store Connect has required since April 2026.
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # WHAT: v4.4.0, 2026-07-20. WHY: pinned by commit, so a moved tag can never change what runs here.
        with:
          ref: ${{ inputs.ref }}  # WHAT: the commit asked for, or empty for the run's own. WHY: as the input says.
          persist-credentials: false  # WHAT: the job's token is not left in .git/config. WHY: nothing after checkout needs it, so no later step can borrow it.
      - name: Rust, for an iPad and for the Simulator
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # WHAT: the stable branch, 2026-10-16. WHY: pinned by commit, as above.
        with:
          toolchain: stable  # WHAT: stable Rust. WHY: pinned by commit, the action no longer reads it from the ref.
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # WHAT: v2.9.3, 2026-10-20. WHY: pinned by commit, so a moved tag can never change what runs here.
      - name: XcodeGen
        run: brew install xcodegen

      - name: The App Store Connect key
        if: ${{ !inputs.check_only && (inputs.archive || inputs.upload) }}  # WHAT: as before, and never for a check build. WHY: a check build needs no key.
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077  # WHAT: the key file is ours alone. WHY: private from its first byte.
          echo "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/appstore.p8"
          team="$(printf '%s' "$SIGN_IDENTITY" | sed -n 's/.*(\([A-Z0-9]\{10\}\)).*/\1/p')"
          test -n "$team" || { echo "no team ID in MACOS_SIGN_IDENTITY" >&2; exit 1; }
          echo "TEAM_ID=$team" >> "$GITHUB_ENV"
          echo "API_KEY_PATH=$RUNNER_TEMP/appstore.p8" >> "$GITHUB_ENV"

      - name: Build
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Rises with every run, as App Store Connect needs it to.
          BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}  # WHAT: the number the caller chose, else the run number. WHY: see the build_number input.
          STEPS: >-
            native project simulator
            ${{ !inputs.check_only && (inputs.archive || inputs.upload) && 'archive' || '' }}
            ${{ !inputs.check_only && inputs.upload && 'upload' || '' }}
        run: mobile/ios/build.sh

      - name: Keep the Simulator build
        if: ${{ !inputs.check_only }}  # WHAT: only when keeping the files. WHY: a check build must leave nothing a release could pick up.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # WHAT: v4.6.2, 2025-03-19. WHY: pinned by commit, so a moved tag can never change what runs here.
        with:
          name: excalibur-view-ipad-simulator
          path: mobile/ios/build/simulator/Build/Products/Release-iphonesimulator/ExcaliburView.app
          if-no-files-found: warn

      - name: Keep the .ipa
        if: ${{ !inputs.check_only && inputs.archive && !inputs.upload }}  # WHAT: as before, never for a check build. WHY: as above.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # WHAT: v4.6.2, 2025-03-19. WHY: pinned by commit, so a moved tag can never change what runs here.
        with:
          name: excalibur-view-ipad
          path: mobile/ios/build/export/*.ipa
          if-no-files-found: warn

      # When the export or upload fails, Xcode writes its real reason only to
      # its own distribution logs, in the runner's temporary folder, and the
      # job log says just "Error Downloading App Information". These copy
      # those logs out so the reason can be read. They hold no key: the App
      # Store Connect key is a separate file in RUNNER_TEMP, removed below.
      - name: Gather Xcode's distribution logs
        if: ${{ failure() && !inputs.check_only }}  # WHAT: as before, never for a check build. WHY: a check build makes no archive, so there are no such logs.
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/distlogs"
          find "${TMPDIR:-/tmp}" /var/folders -maxdepth 6 -name '*.xcdistributionlogs' -print -exec cp -R {} "$RUNNER_TEMP/distlogs/" \; 2>/dev/null || true
          # WHAT: only the error lines, printed here, never the logs as an artifact. WHY: this repository is public, its artifacts can be downloaded by anyone signed in, and the full logs record the App Store Connect session.
          grep -r -h -i -E 'error|fail|reason' "$RUNNER_TEMP/distlogs" 2>/dev/null \
            | grep -v -i -E 'authorization|bearer|token|cookie|password|secret|eyJ|-----BEGIN' | sort -u | head -80 || true  # WHAT: without any line naming a credential or holding one (eyJ starts every JWT; -----BEGIN starts a key). WHY: as above; a token Xcode makes itself is not masked by GitHub.

      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/appstore.p8"

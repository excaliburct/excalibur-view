# Builds the Android app: a debug APK to put on a phone or a Chromebook by
# hand, and the release App Bundle that Play takes.
#
# What this holds, and what it deliberately does not:
#
#   It can hold Play's upload key. That says "this bundle came from Excalibur
#   Construction Technologies" to Play, and nothing more: Play re-signs what
#   it delivers with a key of its own, and a leaked upload key is reset in
#   Play Console. Without the key the bundle comes out unsigned, which is
#   still the whole build, just not one Play will accept.
#
#   It does NOT have the Excalibur signing key, and the Android app has no use
#   for it: Play installs the updates, not the program.
#
# Started by hand, by "Build everything" on every push (check only: no key,
# nothing kept), and by "Release" (signed, then sent to Google Play). See
# mobile/android/build.sh, which is what it runs and what builds the same
# thing on anybody's own machine.

name: Android build

on:
  workflow_dispatch:
  # WHAT: lets "Build everything" (every push) and "Release" run this same build. WHY: one copy of each platform's build, never two drifting apart.
  workflow_call:
    inputs:
      ref:  # WHAT: the commit to build; empty means the one the run started on. WHY: a release builds exactly the commit it names.
        type: string
        default: ""
      check_only:  # WHAT: build and test, keep nothing, sign nothing. WHY: the build on every push proves it builds; it must not leave files a release could pick up.
        type: boolean
        default: false
    secrets:  # WHAT: Play's upload key, passed only by a caller that ships. WHY: the build on every push passes none, so its bundle is unsigned and the key is not in reach.
      ANDROID_UPLOAD_KEYSTORE:
        required: false
      ANDROID_UPLOAD_KEYSTORE_PASSWORD:
        required: false
      ANDROID_UPLOAD_KEY_ALIAS:
        required: false
      ANDROID_UPLOAD_KEY_PASSWORD:
        required: false

# Never on a pull request. A pull request can come from anybody's fork and
# would run their code with the upload key in reach.

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}  # WHAT: one queue per calling workflow and branch. WHY: a push build must never cancel a release build of the same branch, or the other way round.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      # The NDK release the build is made and checked with: r28c. r28 is the
      # first that links for 16 KB pages without being asked.
      NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # WHAT: v4.4.0, 2026-07-20. WHY: pinned by commit, so a moved tag can never change what runs here.
        with:
          ref: ${{ inputs.ref }}  # WHAT: the commit asked for, or empty for the run's own. WHY: as the input says.
          persist-credentials: false  # WHAT: the job's token is not left in .git/config. WHY: nothing after checkout needs it, so no later step can borrow it.
      - name: Rust, for phones and for Chromebooks
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # WHAT: the stable branch, 2026-10-16. WHY: pinned by commit, as above.
        with:
          toolchain: stable  # WHAT: stable Rust. WHY: pinned by commit, the action no longer reads it from the ref.
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # WHAT: v2.9.3, 2026-10-20. WHY: pinned by commit, so a moved tag can never change what runs here.
      # Gradle and the Android plugin run on Java. 17 is the oldest the plugin
      # accepts.
      - name: Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # WHAT: v4.9.1, 2026-08-04. WHY: pinned by commit, so a moved tag can never change what runs here.
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            mobile/android/*.gradle.kts
            mobile/android/app/*.gradle.kts
            mobile/android/gradle/wrapper/gradle-wrapper.properties

      # The runner already carries an Android SDK. This adds exactly the
      # platform, build tools and NDK the app is built against, so an update
      # to the runner image does not quietly change what goes into the app.
      - name: Android SDK and NDK
        run: |
          set -euo pipefail
          # sdkmanager stops reading once every license is accepted, and `yes`
          # is then stopped for writing to nobody. Under pipefail that counted
          # as the whole step failing, so its complaint is let go here.
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.1.0" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # Play's upload key, when the repository has one. Written to a file made
      # for this job and thrown away with the machine.
      - name: Play's upload key
        if: ${{ !inputs.check_only }}  # WHAT: only for a build that ships. WHY: a check build has no key and needs none.
        env:
          UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        run: |
          set -euo pipefail
          if [ -z "$UPLOAD_KEYSTORE" ]; then
            echo "No upload key in this repository's secrets: the bundle will be unsigned."
            exit 0
          fi
          umask 077  # WHAT: the key file is ours alone. WHY: private from its first byte.
          echo "$UPLOAD_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          # WHAT: only the file's path goes to later steps. WHY: the passwords are given to the Build step alone (below), not to every step after this one.
          echo "EXV_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          EXV_KEYSTORE_PASSWORD: ${{ !inputs.check_only && secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD || '' }}  # WHAT: the key's passwords, for this step only, and never for a check build. WHY: Gradle signs here and nowhere else.
          EXV_KEY_ALIAS: ${{ !inputs.check_only && secrets.ANDROID_UPLOAD_KEY_ALIAS || '' }}  # WHAT: as above. WHY: as above.
          EXV_KEY_PASSWORD: ${{ !inputs.check_only && secrets.ANDROID_UPLOAD_KEY_PASSWORD || '' }}  # WHAT: as above. WHY: as above.
        run: mobile/android/build.sh

      - name: Forget the key
        if: always()  # WHAT: however the job ended. WHY: the key file never outlives the build.
        run: rm -f "$RUNNER_TEMP/upload.jks"  # WHAT: removed. WHY: as above.

      - name: What came out
        id: files
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -lh dist/android
          sha256sum dist/android/*

      - name: Hand them over
        if: ${{ !inputs.check_only }}  # WHAT: only when keeping the files. WHY: a check build must leave nothing a release could pick up.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # WHAT: v4.6.2, 2025-03-19. WHY: pinned by commit, so a moved tag can never change what runs here.
        with:
          name: android-${{ steps.files.outputs.version }}
          path: |
            dist/android/*.apk
            dist/android/*.aab
            dist/android/native-debug-symbols-*.zip
          if-no-files-found: error
          retention-days: 30

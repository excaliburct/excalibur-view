[package]
name = "hyperview-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The self-hosted Hyperview server: drawings, markups, takeoffs and updates, over an open API."

[[bin]]
name = "hyperview-server"
path = "src/main.rs"

[lib]
name = "hyperview_server"
path = "src/lib.rs"

[dependencies]
# With its client: the server reads the publisher's release feed itself.
hub = { path = "../hub" }
plugin-api = { path = "../plugin-api" }
plugin-host = { path = "../plugin-host" }
annot = { path = "../annot" }
pdf = { path = "../pdf" }
takeoff = { path = "../takeoff" }
chest = { path = "../chest" }

axum = { version = "0.7", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
# WHAT: gzip for the off-site catalog. WHY: the database copy shrinks several times; already in the build through other crates.
flate2 = "1"
# WHAT: the office's own clock. WHY: "01:30" for the off-site backup means the office's half past one; already in the build through the app.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.8"
argon2 = "0.5"
time = { version = "0.3", features = ["formatting", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# Reading a web address the way the connection will: a host written as
# `2852039166` or `0xa9fea9fe` is an IP address to it, and a change notice
# is judged by what it really points at. Already in the build through ureq.
url = "2"

# Being a real Windows service: answering the service manager, so Windows
# starts it at boot, stops it cleanly at shutdown, and restarts it after an
# update. A console program registered with `sc` and nothing else is killed
# by Windows after thirty seconds for not answering.
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[dev-dependencies]
wat = "1"
ureq = { version = "2", features = ["json", "tls"] }
ed25519-dalek = "2"
hub = { path = "../hub" }
plugin-api = { path = "../plugin-api" }

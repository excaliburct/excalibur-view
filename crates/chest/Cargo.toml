[package]
name = "chest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
annot = { path = "../annot" }
pdf = { path = "../pdf" }
# WHAT: the XML reader, 0.41 or newer. WHY: 0.38 has two advisories (RUSTSEC-2026-0194, -0195: a crafted file
# makes reading take quadratic time or unbounded memory); 0.41.0 fixes both.
quick-xml = "0.41"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
